<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="pragma" content="no-cache">
<title>MeTube</title>
<link rel="stylesheet" href="lite.css">
</head>
<body>

<!-- Status bar -->
<div id="statusbar" class="statusbar">
  <span class="sb-title" id="sbTitle">MeTube</span>
  <span class="sb-right" id="sbCount"></span>
</div>

<!-- Tabs -->
<div class="tabbar" id="tabbar"></div>

<!-- Main view -->
<div class="view" id="view"></div>

<!-- Now-playing mini bar -->
<div class="npbar" id="npbar" style="display:none;">
  <div class="np-info">
    <div class="np-title" id="npTitle">--</div>
    <div class="np-sub" id="npSub">--</div>
  </div>
  <button class="np-btn" id="npToggle">&#9654;</button>
  <button class="np-btn" id="npNext">&#9654;&#9654;</button>
</div>

<div class="npprog" id="npprog" style="display:none;">
  <div class="npprog-fill" id="npprogFill"></div>
</div>

<!-- Softkey bar -->
<div class="softkeys" id="softkeys">
  <span class="sk-left" id="skLeft">Options</span>
  <span class="sk-center" id="skCenter">Select</span>
  <span class="sk-right" id="skRight">Back</span>
</div>

<audio id="player" preload="metadata"></audio>

<script src="lite.js"></script>
</body>
</html>
